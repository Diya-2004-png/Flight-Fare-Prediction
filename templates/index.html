<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flight Price Predictor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#0b1f3a;
height:100vh;
font-family:'Segoe UI';
}

.navbar{
background:#071a33;
box-shadow:0px 5px 20px rgba(0,0,0,0.4);
}

.main-container{
display:flex;
align-items:center;
justify-content:center;
height:90vh;
}

.card{
width:620px;
padding:35px;
border-radius:22px;
background:#112d57;
box-shadow:0px 30px 70px rgba(0,0,0,0.6);
color:white;
animation: slideUp .8s ease;
transition:.4s;
}

.card:hover{
transform:translateY(-6px);
box-shadow:0px 40px 90px rgba(0,0,0,0.8);
}

.title{
text-align:center;
font-weight:bold;
font-size:30px;
margin-bottom:20px;
letter-spacing:1px;
}

.plane{
text-align:center;
font-size:40px;
margin-bottom:10px;
animation: fly 2s infinite alternate;
}

@keyframes fly{
from{transform:translateX(-8px)}
to{transform:translateX(8px)}
}

.form-control,.form-select{
background:#0b2545;
border:none;
color:white;
border-radius:12px;
}

.form-control:focus,.form-select:focus{
background:#0b2545;
color:white;
box-shadow:0px 0px 14px #3b82f6;
}

.predict-btn{
background:linear-gradient(90deg,#2563eb,#3b82f6);
border:none;
font-weight:bold;
transition:.3s;
}

.predict-btn:hover{
transform:scale(1.05);
box-shadow:0px 12px 30px rgba(59,130,246,.6);
}

.result-box{
margin-top:20px;
padding:18px;
border-radius:14px;
background:#021b35;
text-align:center;
font-size:25px;
font-weight:bold;
color:#60a5fa;
animation: pop .5s;
}

@keyframes pop{
from{opacity:0;transform:scale(.7)}
to{opacity:1;transform:scale(1)}
}

@keyframes slideUp{
from{opacity:0;transform:translateY(40px)}
to{opacity:1;transform:translateY(0)}
}

</style>

</head>

<body>

<nav class="navbar navbar-dark">
<div class="container-fluid">
<span class="navbar-brand mb-0 h1">✈️ Flight Price AI Predictor</span>
</div>
</nav>

<div class="main-container">

<div class="card">

<div class="plane">✈️</div>

<div class="title">Check Flight Price</div>

<form action="/predict" method="post" onsubmit="showLoader()">

<div class="mb-3">
<label>Airline</label>
<select name="airline" class="form-select">
<option value="0">IndiGo</option>
<option value="1">Air India</option>
<option value="2">Jet Airways</option>
<option value="3">SpiceJet</option>
</select>
</div>

<div class="mb-3">
<label>Source</label>
<select name="source" class="form-select">
<option value="0">Delhi</option>
<option value="1">Mumbai</option>
<option value="2">Kolkata</option>
<option value="3">Chennai</option>
</select>
</div>

<div class="mb-3">
<label>Destination</label>
<select name="destination" class="form-select">
<option value="0">Cochin</option>
<option value="1">Hyderabad</option>
<option value="2">New Delhi</option>
<option value="3">Bangalore</option>
</select>
</div>

<div class="row">
<div class="col">
<label>Date</label>
<input type="date" name="date" class="form-control">
</div>

<div class="col">
<label>Time</label>
<input type="time" name="time" class="form-control">
</div>
</div>

<br>

<div class="d-grid">
<button id="predictBtn" class="btn predict-btn btn-lg">
Predict Price 🚀
</button>
</div>

</form>

{% if result %}
<div class="result-box">
{{ result }}
</div>
{% endif %}

</div>

</div>

<script>
function showLoader(){
let btn=document.getElementById("predictBtn")
btn.innerHTML="Predicting..."
btn.disabled=true
}
</script>

</body>
</html>
